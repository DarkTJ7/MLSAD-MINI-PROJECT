name: Tests and optional Docker rehearsal
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      docker_rehearsal:
        description: Download safety models and exercise Compose on Linux
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: cp .env.example .env && docker compose config --quiet
  docker:
    if: github.event_name == 'workflow_dispatch' && inputs.docker_rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up -d --build --wait --wait-timeout 900
      - run: docker compose exec -T -e DEMO_BASE_URL=http://api:8000 api python -m evaluation.live_demo
      - if: always()
        run: docker compose logs --no-color > compose-rehearsal.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-rehearsal
          path: compose-rehearsal.log
      - if: always()
        run: docker compose down
